---
- name: Desktop Environment Setup
  hosts: local
  become: true

  vars:
    # Change this to your actual system username
    target_user: "haji_amzar"

  vars_files:
    - flatpak_vars.yml

  tasks:
    - name: Load OS-specific variables
      include_vars: "{{ item }}"
      with_first_found:
        - files:
            - "{{ ansible_os_family }}.yml"
            - "default.yml"
          paths:
            - "vars"

    - name: Install system utilities and core applications
      package:
        name: "{{ system_packages }}"
        state: present

    - name: Create /etc/greetd configuration directory
      file:
        path: /etc/greetd
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Write greetd configuration file
      copy:
        dest: /etc/greetd/config.toml
        content: |
          [terminal]
          vt = 1

          [default_session]
          # cage runs gtkgreet as a kiosk; -s enables VT switching
          command = "cage -s -- gtkgreet --remember --remember-session -c labwc"
          user = "greeter"

    - name: Define available graphical environments for gtkgreet
      copy:
        dest: /etc/greetd/environments
        content: |
          labwc

    - name: Enable and start core system and networking services
      systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - greetd
        - NetworkManager
        - firewalld

    - name: Install GNU Stow for dotfiles management
      package:
        name: stow
        state: present

    - name: Clone or update dotfiles repository (as target user)
      git:
        repo: 'https://github.com/hajiamzar/dotfiles.git' # Replace with your actual repo URL
        dest: "~/.dotfiles"
        accept_hostkey: true
        update: true
      become: true
      become_user: "{{ target_user }}"

    - name: Stow dotfiles configurations into ~/.config (as target user)
      command: >
        stow -d "~/.dotfiles"
             -t "~/.config"
             labwc noctalia alacritty nvim
      args:
        creates: "~/.config/labwc"
      become: true
      become_user: "{{ target_user }}"

    - name: Add Flathub repository
      community.general.flatpak_remote:
        name: flathub
        state: present
        method: user
        url: https://dl.flathub.org/repo/flathub.flatpakrepo
      become: true
      become_user: "{{ target_user }}"

    - name: Install specified Flatpak packages for the user
      community.general.flatpak:
        name: "{{ item }}"
        state: present
        method: user
      loop: "{{ flatpak_packages }}"
      become: true
      become_user: "{{ target_user }}"
